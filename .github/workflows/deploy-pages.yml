name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build sanitized static bundle
        run: npm run build

      - name: Verify no private data in dist
        run: |
          if grep -RniE "phamquangtrung962196|C:/Users/Admin|sk-or-v1-[0-9a-zA-Z]{20,}|AIza[0-9A-Za-z_-]{20,}" dist/; then
            echo "Private data detected in dist/!"
            exit 1
          fi

      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
